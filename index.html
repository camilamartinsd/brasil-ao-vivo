<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brasil ao Vivo – Brazilian concerts &amp; shows from Cologne</title>
<meta name="description" content="Brazilian concerts, shows, parties and art exhibitions in Cologne, across Germany and around Europe.">
<meta name="theme-color" content="#08402e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7ef; --ink:#1b1f1c; --muted:#5d645f; --line:#e6dfd0;
    --green:#0d6b4c; --green-d:#08402e; --sun:#f3b81b; --blue:#1f3f8f; --coral:#e2603f;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
  a{color:var(--green)}
  header{background:radial-gradient(110% 95% at 78% 45%,#0e5a3b 0%,#08402e 50%,#05291d 100%);color:#fff;position:relative;overflow:hidden}
  header svg.waves{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  header .wrap{max-width:1240px;padding:64px 40px 44px;position:relative;z-index:1;display:grid;grid-template-columns:1fr minmax(200px,300px);gap:40px;align-items:center}
  header svg.flag{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
  .langs{position:absolute;top:18px;right:40px;z-index:2;display:flex;gap:2px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px}
  .langs button{all:unset;cursor:pointer;font:700 14px Manrope,sans-serif;letter-spacing:.04em;color:#e3ece7;padding:8px 18px;border-radius:999px}
  .langs button[aria-pressed="true"]{background:var(--sun);color:var(--green-d)}
  .langs button:focus-visible{outline:2px solid #fff}
  .eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:14px;font-weight:700;color:var(--sun)}
  h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:clamp(44px,6vw,78px);line-height:.95;margin:10px 0 14px;text-shadow:0 4px 18px rgba(0,0,0,.25)}
  h1 em{color:var(--sun);font-style:italic}
  header p{max-width:600px;margin:0;color:#e3ece7;font-size:clamp(17px,1.7vw,21px);line-height:1.45}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}
  .stats{display:flex;flex-wrap:wrap;row-gap:14px;margin-top:26px}
  .stats div{font-size:15px;color:#d9e6df;padding:0 34px;border-left:1px solid rgba(255,255,255,.22)}
  .stats div:first-child{padding-left:0;border-left:0}
  .stats b{display:block;font-family:"DM Serif Display",serif;font-size:36px;line-height:1.1;font-weight:400;color:#fff}

  .controls{position:sticky;top:0;z-index:5;background:rgba(251,247,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .controls .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:14px;padding-bottom:14px}
  .group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .group span.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font:600 13px Manrope,sans-serif;color:var(--ink);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
  input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:500 14px Manrope,sans-serif;background:#fff}

  .news{padding-top:30px}
  .news-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .news-head h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:30px;margin:0}
  .news-head h2 em{color:var(--coral)}
  .news-head small{font-size:13px;color:var(--muted)}
  .feed{list-style:none;margin:14px 0 0;padding:0;background:#fff;border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:12px}
  .item{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:baseline;padding:13px 18px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .when{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}
  .item h4{margin:0;font-size:15.5px;line-height:1.35}
  .item p{margin:2px 0 0;font-size:13.5px;color:#3c433e}
  .item .links{display:flex;gap:14px;font-size:13px;font-weight:700;white-space:nowrap}
  @media (max-width:720px){.item{grid-template-columns:1fr}.item .links{white-space:normal}}
  .item .links a{text-decoration:none}
  .item .links button{all:unset;cursor:pointer;color:var(--blue)}
  .more{margin-top:10px;font:600 13px Manrope,sans-serif;background:none;border:0;color:var(--green);cursor:pointer;padding:0}

  main .wrap{padding-top:20px;padding-bottom:40px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;color:var(--muted);margin:18px 0 0;padding:10px 14px;background:#f4efe3;border-radius:10px}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{display:inline-block;width:5px;height:16px;border-radius:2px;background:var(--sun)}
  .legend .tag{font-style:normal}
  .month{font-family:"DM Serif Display",serif;font-size:28px;font-weight:400;margin:34px 0 12px;display:flex;align-items:baseline;gap:12px}
  .month small{font-family:Manrope;font-size:13px;color:var(--muted)}
  .ev{display:grid;grid-template-columns:78px 1fr auto;gap:18px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
  .ev.near{border-left:5px solid var(--sun)}
  .ev.flash{animation:flash 1.8s ease}
  @keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--sun)}100%{box-shadow:0 0 0 0 transparent}}
  .date{text-align:center;border-radius:10px;background:#f4efe3;padding:8px 4px}
  .date .d{font-family:"DM Serif Display",serif;font-size:30px;line-height:1}
  .date .m{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--green)}
  .date .w{font-size:11px;color:var(--muted)}
  .ev h3{margin:0 0 2px;font-size:18px}
  .ev .where{font-size:14px;color:var(--muted)}
  .ev .where b{color:var(--ink);font-weight:600}
  .ev .desc{font-size:14px;margin:6px 0 0}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef3f0;color:var(--green-d)}
  .tag.type-Theatre{background:#efeaf8;color:#4b2a8a}
  .tag.type-Party{background:#fdeee9;color:#9a3519}
  .tag.type-Exhibition{background:#e6eefb;color:#1f3f8f}
  .tag.on{background:var(--green);color:#fff}
  .date.run .w{font-weight:700;color:var(--green)}
  .tag.km{background:#fff4d4;color:#7a5800}
  .tag.top{background:var(--blue);color:#fff}
  .tag.new{background:var(--coral);color:#fff}
  .ev .go{align-self:center;white-space:nowrap;text-decoration:none;font-weight:700;font-size:13px;border:1.5px solid var(--green);border-radius:999px;padding:7px 14px}
  .ev .go:hover{background:var(--green);color:#fff}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  section.info{border-top:1px solid var(--line);background:#f4efe3}
  section.info .wrap{padding-top:36px;padding-bottom:40px}
  section.info ul{columns:2;column-gap:36px}
  section.info li{break-inside:avoid}
  @media (max-width:720px){section.info ul{columns:1}}
  section.info h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:26px;margin:0 0 12px}
  section.info ul{margin:0;padding-left:18px}
  section.info li{margin-bottom:10px;font-size:14px}
  footer{font-size:12px;color:var(--muted)}
  footer .wrap{padding:22px 24px 40px}
  .install{position:absolute;top:18px;left:40px;z-index:2;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:700 14px Manrope,sans-serif;color:#fff;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 16px}
  .install:hover{background:rgba(0,0,0,.35)}
  .install[hidden],.install-tip[hidden]{display:none}
  .install svg{width:16px;height:16px}
  #installHide{all:unset;display:block;margin-top:10px;color:var(--green);font-weight:700;font-size:13px;cursor:pointer}
  .install-tip{position:absolute;top:68px;left:40px;z-index:3;max-width:290px;background:#fff;color:var(--ink);font-size:14px;line-height:1.45;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  @media (max-width:720px){
    .install{left:20px;top:16px;padding:6px 11px;font-size:12px;gap:6px}
    .install svg{width:13px;height:13px}
    .install-tip{left:24px;right:24px;top:70px}
    .controls .wrap{gap:8px;padding-top:10px;padding-bottom:10px}
    .group{flex-wrap:nowrap;overflow-x:auto;width:calc(100% + 24px);margin-right:-24px;padding-right:24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .group::-webkit-scrollbar{display:none}
    .group span.lbl{min-width:44px}
    .chip{white-space:nowrap;padding:5px 11px;font-size:12.5px;flex:none}
    input[type=search]{padding:7px 12px;font-size:16px}
    .news{padding-top:22px}
    .news-head h2{font-size:24px}
    .item{padding:11px 14px}
    .item p{display:none}
    .item .links{font-size:12.5px}
    .month{font-size:24px;margin:26px 0 10px}
    .ev{padding:14px;gap:12px}
    .date{padding:6px 2px}
    .date .d{font-size:24px}
    .ev h3{font-size:16.5px}
    .ev .where,.ev .desc{font-size:13.5px}
    .ev{grid-template-columns:52px 1fr}
    .ev .go{grid-column:2;justify-self:start}
    section.info .wrap{grid-template-columns:1fr}
    header .wrap{grid-template-columns:1fr;padding:74px 24px 30px;gap:16px}
    .eyebrow{font-size:12px;letter-spacing:.16em}
    header .flagwrap{display:none}
    .langs{right:20px;top:16px;padding:3px}
    .langs button{font-size:12px;padding:5px 11px}
    .stats{display:grid;grid-template-columns:1fr 1fr}
    .stats div{padding:0 18px}
    .stats div:nth-child(odd){padding-left:0;border-left:0}
    .stats b{font-size:28px}
  }
</style>
</head>
<body>
<header>
  <svg class="waves" viewBox="0 0 1400 700" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 0 H760 C600 80 330 170 0 250Z" fill="#ffffff" opacity=".035"/>
    <path d="M1400 430 C1160 500 930 610 720 700 H1400Z" fill="#ffffff" opacity=".045"/>

  <div class="install-tip" id="installTip" hidden><span data-t="iosTip"></span><button type="button" id="installHide" data-t="installHide"></button></div>

    <button data-lang="en" aria-pressed="true">EN</button>

    <div class="stats" id="stats"></div>
  </div>
  <div class="flagwrap">
    <svg class="flag" viewBox="0 0 460 440" aria-hidden="true">
      <defs>
        <radialGradient id="fg-circle" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#1a8a57"/><stop offset="1" stop-color="#0f6a43"/></radialGradient>
        <linearGradient id="fg-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcf2e"/><stop offset="1" stop-color="#efb000"/></linearGradient>
        <radialGradient id="fg-blue" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#2547a3"/><stop offset="1" stop-color="#16307a"/></radialGradient>
        <clipPath id="fg-clip"><circle cx="230" cy="220" r="104"/></clipPath>
      </defs>
      <circle cx="230" cy="220" r="212" fill="url(#fg-circle)" opacity=".5"/>
      <path d="M4 220 L230 60 L456 220 L230 380Z" fill="url(#fg-sun)"/>
      <circle cx="230" cy="220" r="104" fill="url(#fg-blue)"/>
      <path d="M118 208 Q230 176 342 222" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round" clip-path="url(#fg-clip)"/>
    </svg>
  </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="group" id="regionGroup">
      <span class="lbl" data-t="where"></span>
      <button class="chip" data-region="near" aria-pressed="false" data-t="near"></button>
      <button class="chip" data-region="de" aria-pressed="false" data-t="germany"></button>
      <button class="chip" data-region="all" aria-pressed="true" data-t="allEurope"></button>
    </div>
    <div class="group" id="typeGroup">
      <span class="lbl" data-t="what"></span>
      <button class="chip" data-type="all" aria-pressed="true" data-t="everything"></button>
      <button class="chip" data-type="Concert" aria-pressed="false" data-t="concerts"></button>
      <button class="chip" data-type="Party" aria-pressed="false" data-t="parties"></button>
      <button class="chip" data-type="Theatre" aria-pressed="false" data-t="theatre"></button>
      <button class="chip" data-type="Exhibition" aria-pressed="false" data-t="exhibitions"></button>
    </div>
    <input type="search" id="q">
  </div>
</div>

<section class="news"><div class="wrap">
  <div class="news-head"><h2 data-t="newsTitle"></h2><small id="checked"></small></div>
  <ul class="feed" id="feed"></ul>
  <button class="more" id="moreNews" hidden></button>
</div></section>

<main><div class="wrap">
  <div id="list"></div>
</div></main>

<section class="info">
  <div class="wrap">
    <div><h2 data-t="regularsTitle"></h2><ul id="regulars"></ul></div>
  </div>
</section>

<footer><div class="wrap" data-t="footer"></div></footer>

<script>
const KOELN=[50.9375,6.9603];
const C={ // city coordinates [lat,lon]
  "Köln":[50.94,6.96],"Kempen":[51.36,6.42],"Bergkamen":[51.62,7.64],
  "Berlin":[52.52,13.40],"Hamburg":[53.55,9.99],"Frankfurt":[50.11,8.68],"München":[48.14,11.58],

  "Lisbon":[38.72,-9.14],"Porto":[41.15,-8.61],"Barcelona":[41.39,2.17],"Rome":[41.90,12.50],
  "Hannover":[52.37,9.73],"Freiburg":[47.99,7.85],"Mannheim":[49.49,8.47],"Bottrop":[51.52,6.92],
  "Venice":[45.44,12.33],"Sindelfingen":[48.71,9.00],"Nürnberg":[49.45,11.08],"Rotterdam":[51.92,4.48],
  "Bonn":[50.71,7.10]
};
const DE=new Set(["Köln","Kempen","Bergkamen","Berlin","Hamburg","Frankfurt","München","Hannover","Freiburg","Mannheim","Bottrop","Sindelfingen","Nürnberg","Bonn"]);
// Optional translated city names (key = city as used in EVENTS)
const CITY_NAMES={
  "Köln":{en:"Cologne",pt:"Colônia"},"Berlin":{pt:"Berlim"},"Hamburg":{pt:"Hamburgo"},"München":{en:"Munich",pt:"Munique"},
  "Lisbon":{pt:"Lisboa",de:"Lissabon"},"Rome":{pt:"Roma",de:"Rom"},"London":{pt:"Londres"},"Amsterdam":{pt:"Amsterdã"},"Venice":{pt:"Veneza",de:"Venedig"},
  "Nürnberg":{en:"Nuremberg",pt:"Nuremberg"},"Rotterdam":{pt:"Roterdã"}
};

/* ===================== DATA-START =====================
   How to update:
   - META.lastChecked: date (YYYY-MM-DD) of the latest check for new events.
   - Text fields (title, venue, price, desc, headline, text) may be a plain string (same in all
     languages) or an object {en:"…", pt:"…", de:"…"} — always give all three for descriptive text.
     pt = Brazilian Portuguese, de = German. English is the fallback.
   - EVENTS: one object per show. Fields: d (YYYY-MM-DD), t (time, optional), title, city
     (must exist in C at the top of this script; add it with [lat,lon] if new; German cities also go
     in DE; optional translated names in CITY_NAMES), venue, type ("Concert"|"Party"|"Theatre"|"Exhibition"),
     until (exhibitions only: closing date YYYY-MM-DD; d = opening date),
     price (optional), desc, url, hot (optional, editor's top pick), added (YYYY-MM-DD it was added;
     omit for launch set). Past events hide automatically.
   - NEWS: fields date (YYYY-MM-DD announced/added), headline, text, url,
     refs: ["YYYY-MM-DD|City", ...] linking to events in the timeline. Sorted newest first in code.
*/
const META={launch:"2026-11-18",lastChecked:"2026-11-20"};

const NEWS=[
 {date:"2026-11-20",
  headline:{en:"Tarsila do Amaral and Lygia Clark in Bonn: “Vanguardistas” opens 4 December",pt:"Tarsila do Amaral e Lygia Clark em Bonn: “Vanguardistas” abre em 4 de dezembro",de:"Tarsila do Amaral und Lygia Clark in Bonn: „Vanguardistas“ startet am 4. Dezember"},
  text:{en:"The Bundeskunsthalle's survey of 100 years of Latin American women artists includes Brazilian pioneers Tarsila do Amaral, Lygia Clark and Djanira, with loans from São Paulo's Pinacoteca and MASP – just 25 minutes from Cologne, until 29 March 2027.",pt:"A mostra da Bundeskunsthalle sobre 100 anos de artistas latino‑americanas inclui as pioneiras brasileiras Tarsila do Amaral, Lygia Clark e Djanira, com empréstimos da Pinacoteca e do MASP – a só 25 minutos de Colônia, até 29 de março de 2027.",de:"Die Schau der Bundeskunsthalle über 100 Jahre lateinamerikanischer Künstlerinnen zeigt auch die brasilianischen Pionierinnen Tarsila do Amaral, Lygia Clark und Djanira, mit Leihgaben von Pinacoteca und MASP aus São Paulo – nur 25 Minuten von Köln, bis 29. März 2027."},
  url:"https://www.bundeskunsthalle.de/en/vanguardistas",refs:["2026-12-04|Bonn"]},
 {date:"2026-11-20",
  headline:{en:"Aleijadinho, master of the Brazilian baroque, at the Vatican Museums",pt:"Aleijadinho, mestre do barroco brasileiro, nos Museus Vaticanos",de:"Aleijadinho, Meister des brasilianischen Barock, in den Vatikanischen Museen"},
  text:{en:"A show on the 18th‑century sculptor and architect from Minas Gerais opened on 18 November in the Borgia Tower rooms and runs until 13 February 2027.",pt:"Uma mostra sobre o escultor e arquiteto mineiro do século XVIII abriu em 18 de novembro nas salas da Torre Borgia e fica em cartaz até 13 de fevereiro de 2027.",de:"Eine Ausstellung über den Bildhauer und Architekten aus Minas Gerais (18. Jh.) ist seit 18. November in den Räumen des Borgia‑Turms zu sehen, bis 13. Februar 2027."},
  url:"https://www.museivaticani.va/content/museivaticani/en/eventi-e-novita/iniziative/mostre/2026/aleijadinho-maestro-barocco-brasiliano.html",refs:["2026-11-18|Rome"]},
 {date:"2026-11-19",
  headline:{en:"Ernesto Neto at the Depot Boijmans in Rotterdam",pt:"Ernesto Neto no Depot Boijmans, em Roterdã",de:"Ernesto Neto im Depot Boijmans in Rotterdam"},
  text:{en:"Museum Boijmans Van Beuningen has announced a show by the Rio artist, known for his walk‑in crocheted sculptures, at its Depot from 17 April to 19 September 2027. Rotterdam is about 2.5 hours from Cologne by train.",pt:"O Museu Boijmans Van Beuningen anunciou uma mostra do artista carioca, conhecido por suas esculturas de crochê que podem ser percorridas, no seu Depot de 17 de abril a 19 de setembro de 2027. Roterdã fica a cerca de 2h30 de trem de Colônia.",de:"Das Museum Boijmans Van Beuningen zeigt den Künstler aus Rio, bekannt für seine begehbaren Häkelskulpturen, vom 17. April bis 19. September 2027 in seinem Depot. Rotterdam ist von Köln aus in rund 2,5 Stunden mit dem Zug erreichbar."},
  url:"https://www.boijmans.nl/en/exhibitions/ernestoneto",refs:["2027-04-17|Rotterdam"]},
 {date:"2026-11-19",

 de:{eyebrow:"Musik · Theater · Kunst · Party — ab Köln",intro:"Brasilianische Konzerte, Shows, Partys und Kunstausstellungen in Köln, in ganz Deutschland und in Europa.",

const LOCALE={en:"en-GB",pt:"pt-BR",de:"de-DE"};

let lang="en";
try{const s=localStorage.getItem("bav-lang");if(T[s])lang=s;}catch(e){}
const h=(location.hash||"").slice(1); if(T[h]) lang=h;

const L=x=>x==null?"":(typeof x==="object"?(x[lang]||x.en||""):x);
const t=k=>T[lang][k]??T.en[k];
const cityName=c=>(CITY_NAMES[c]&&CITY_NAMES[c][lang])||c;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=o=>new Intl.DateTimeFormat(LOCALE[lang],o);

function km(city){
  const [a,b]=C[city]||KOELN, R=6371, toR=x=>x*Math.PI/180;
  const dLat=toR(a-KOELN[0]), dLon=toR(b-KOELN[1]);
  const q=Math.sin(dLat/2)**2+Math.cos(toR(KOELN[0]))*Math.cos(toR(a))*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(q)));
}
const iso=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());};
const TODAY=iso(new Date());
const D=s=>new Date(s+"T12:00:00");
const daysAgo=s=>Math.round((D(TODAY)-D(s))/864e5);
EVENTS.forEach(e=>{
  e.km=km(e.city);e.near=e.km<=250;e.de=DE.has(e.city);
  e.end=e.until||e.d; e.running=!!e.until&&e.d<=TODAY; e.sk=e.running?TODAY:e.d;
  e.key=e.d+"|"+e.city; e.id="ev-"+(e.key+"-"+L.call(null,e.title)).toLowerCase().replace(/[^a-z0-9]+/g,"-");
  e.isNew=!!e.added && e.added>META.launch && daysAgo(e.added)<=30;
});

let region="all", type="all", q="", showAllNews=false;
try{const r=localStorage.getItem("bav-region");if(r)region=r;const ty=localStorage.getItem("bav-type");if(ty)type=ty;}catch(e){}

function applyStatic(){
  document.documentElement.lang=lang;
  document.title=t("docTitle");
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t(el.dataset.t);});
  document.getElementById("q").placeholder=t("search");
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("#regionGroup .chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.region===region));
  document.querySelectorAll("#typeGroup .chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.type===type));
  const li=x=>`<li><b>${esc(L(x.name))}</b> — ${esc(L(x.text))}${x.html?" "+x.html:""}${x.url?` <a href="${x.url}" target="_blank" rel="noopener">${esc(L(x.link))}</a>`:""}</li>`;
  document.getElementById("regulars").innerHTML=REGULARS.map(li).join("");
}

function stats(){
  const up=EVENTS.filter(e=>e.end>=TODAY);
  const near=up.filter(e=>e.near).length, de=up.filter(e=>e.de).length;
  const cities=new Set(up.map(e=>e.city)).size;
  document.getElementById("stats").innerHTML=`<div><b>${up.length}</b>${t("sUp")}</div><div><b>${near}</b>${t("sNear")}</div><div><b>${de}</b>${t("sDe")}</div><div><b>${cities}</b>${t("sCities")}</div>`;
}

const txtAll=v=>typeof v==="object"&&v?Object.values(v).join(" "):(v||"");
function match(e){
  if(e.end<TODAY) return false;
  if(region==="near"&&!e.near) return false;
  if(region==="de"&&!e.de) return false;
  if(type!=="all"&&e.type!==type) return false;
  if(q){const hay=[txtAll(e.title),e.city,cityName(e.city),txtAll(e.venue),txtAll(e.desc)].join(" ").toLowerCase(); if(!hay.includes(q)) return false;}
  return true;
}
function renderFeed(){
  const all=[...NEWS].sort((a,b)=>b.date.localeCompare(a.date));
  const filtering=region!=="all"||type!=="all"||!!q;
  const sorted=filtering?all.filter(n=>(n.refs||[]).some(r=>EVENTS.some(e=>e.key===r&&match(e)))||(!!q&&region==="all"&&type==="all"&&(txtAll(n.headline)+" "+txtAll(n.text)).toLowerCase().includes(q))):all;
  document.querySelector("section.news").hidden=!sorted.length;
  const lim=(()=>{try{return matchMedia("(max-width:720px)").matches?3:6}catch(e){return 6}})();
  const shown=showAllNews?sorted:sorted.slice(0,lim);
  const fDM=fmt({day:"numeric",month:"short"});
  document.getElementById("feed").innerHTML=shown.map(n=>{
    const d=D(n.date);
    const label=n.date===META.launch?t("tracked")+" "+fDM.format(d):(daysAgo(n.date)<=7?t("newWeek")+" ":t("announced")+" ")+fDM.format(d);
    const ref=(n.refs||[]).map(r=>EVENTS.find(e=>e.key===r&&e.end>=TODAY)).find(Boolean);
    const fresh=n.date>META.launch&&daysAgo(n.date)<=7;
    return `<li class="item"><div><h4>${fresh?`<span class="tag new" title="${esc(label)}">${t("newAdded").split("·")[0].trim()}</span> `:""}${esc(L(n.headline))}</h4><p>${esc(L(n.text))}</p></div>
      <div class="links">${ref?`<button data-jump="${ref.id}">${t("seeTimeline")}</button>`:""}${n.url?`<a href="${n.url}" target="_blank" rel="noopener">${t("source")}</a>`:""}</div></li>`;
  }).join("");
  const more=document.getElementById("moreNews");
  more.hidden=sorted.length<=lim; more.textContent=showAllNews?t("fewer"):t("older")+" ("+(sorted.length-lim)+")";
  document.getElementById("checked").textContent=t("checked")+" "+fmt({day:"numeric",month:"short",year:"numeric"}).format(D(META.lastChecked));
}

function render(){
  const list=document.getElementById("list");
  const items=EVENTS.filter(e=>{
    if(e.end<TODAY) return false;
    if(region==="near"&&!e.near) return false;
    if(region==="de"&&!e.de) return false;
    if(type!=="all"&&e.type!==type) return false;
    if(q){
      const txt=v=>typeof v==="object"&&v?Object.values(v).join(" "):(v||"");
      const hay=[txt(e.title),e.city,cityName(e.city),txt(e.venue),txt(e.desc)].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>a.sk.localeCompare(b.sk)||(a.running&&b.running?a.end.localeCompare(b.end):a.d.localeCompare(b.d)));
  if(!items.length){list.innerHTML=`<div class="empty">${t("empty")}</div>`;return;}
  const fM=fmt({month:"long",year:"numeric"}), fS=fmt({month:"short"}), fW=fmt({weekday:"short"}), fDM=fmt({day:"numeric",month:"short"});
  const typeLabel={Concert:t("tConcert"),Party:t("tParty"),Theatre:t("tTheatre"),Exhibition:t("tExhibition")};
  let html="",cur="";
  for(const e of items){
    const dt=D(e.running?e.until:e.d);
    const m=fM.format(D(e.sk));
    if(m!==cur){cur=m;const n=items.filter(x=>fM.format(D(x.sk))===m).length;
      html+=`<h2 class="month">${m.charAt(0).toUpperCase()+m.slice(1)}<small>${n} ${n>1?t("evN"):t("ev1")}</small></h2>`;}
    html+=`<article class="ev${e.near?" near":""}" id="${e.id}">
      <div class="date${e.running?" run":""}">${e.running?`<div class="w">${t("untilL")}</div>`:""}<div class="m">${fS.format(dt).replace(".","")}</div><div class="d">${dt.getDate()}</div>${e.running?"":`<div class="w">${fW.format(dt).replace(".","")}${e.t?" · "+e.t:""}</div>`}</div>
      <div>
        <h3>${esc(L(e.title))}</h3>
        <div class="where"><b>${esc(cityName(e.city))}</b> · ${esc(L(e.venue))}${e.price?" · "+esc(L(e.price)):""}${e.until?" · "+fDM.format(D(e.d))+" – "+fmt({day:"numeric",month:"short",year:"numeric"}).format(D(e.until)):""}</div>
        <p class="desc">${esc(L(e.desc))}</p>
        <div class="tags">${e.isNew?`<span class="tag new">${t("newAdded")} ${fDM.format(D(e.added))}</span>`:""}<span class="tag type-${e.type}">${typeLabel[e.type]}</span>${e.running?`<span class="tag on">${t("onNow")}</span>`:""}<span class="tag km">${e.city==="Köln"?t("inKoeln"):t("km").replace("{n}",e.km)}</span>${e.hot?`<span class="tag top">${t("top")}</span>`:""}</div>
      </div>
      <a class="go" href="${e.url}" target="_blank" rel="noopener">${t("tickets")}</a>
    </article>`;
  }
  list.innerHTML=html;
}

function renderAll(){applyStatic();stats();renderFeed();render();}

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.lang; try{localStorage.setItem("bav-lang",lang)}catch(e){}
  try{history.replaceState(null,"",lang==="en"?location.pathname+location.search:"#"+lang)}catch(e){}
  renderAll();
}));
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(T[k]&&k!==lang){lang=k;renderAll();}});
function bind(groupId,attr,setter){
  document.querySelectorAll(`#${groupId} .chip`).forEach(b=>b.addEventListener("click",()=>{
    setter(b.dataset[attr]); applyStatic(); render(); renderFeed();
    try{localStorage.setItem("bav-"+attr,b.dataset[attr])}catch(e){}
  }));
}
bind("regionGroup","region",v=>region=v);
bind("typeGroup","type",v=>type=v);
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render();renderFeed();});
document.getElementById("moreNews").addEventListener("click",()=>{showAllNews=!showAllNews;renderFeed();});
document.getElementById("feed").addEventListener("click",ev=>{
  const b=ev.target.closest("[data-jump]"); if(!b) return;
  let el=document.getElementById(b.dataset.jump);
  if(!el){region="all";type="all";q="";document.getElementById("q").value="";applyStatic();render();renderFeed();el=document.getElementById(b.dataset.jump);}
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
});
renderAll();
try{matchMedia("(max-width:720px)").addEventListener("change",()=>renderFeed());}catch(e){}

/* ---- Installable app (PWA) ---- */
(function(){
  const ib=document.getElementById("installBtn"), tip=document.getElementById("installTip");
  let deferred=null;
  const standalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const KEY="bav-install-hidden";
  const dismissed=()=>{try{return localStorage.getItem(KEY)==="1"}catch(e){return false}};
  const show=()=>{if(!standalone()&&!dismissed()) ib.hidden=false;};
  document.getElementById("installHide").addEventListener("click",()=>{try{localStorage.setItem(KEY,"1")}catch(e){} ib.hidden=true;tip.hidden=true;});
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show();});
  window.addEventListener("appinstalled",()=>{ib.hidden=true;tip.hidden=true;try{localStorage.setItem(KEY,"1")}catch(e){}});
  // On iPhone/iPad there is no install prompt: show the button with instructions, but only where the app files exist
  if(isIOS&&!standalone()){
    try{fetch("manifest.webmanifest",{method:"HEAD",cache:"no-store"}).then(r=>{if(r.ok) show();}).catch(()=>{});}catch(e){}
  }
  ib.addEventListener("click",async()=>{
    if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){} deferred=null; ib.hidden=true;}
    else tip.hidden=!tip.hidden;
  });
  document.addEventListener("click",e=>{if(!tip.hidden&&!tip.contains(e.target)&&!ib.contains(e.target)) tip.hidden=true;});
  if("serviceWorker" in navigator&&location.protocol==="https:"){
    try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
  }
})();
</script>
